<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - AFYL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4fc3f7;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-label { color: #888; }
        .info-value { color: #4fc3f7; }
        .notice-box {
            background: rgba(79, 195, 247, 0.1);
            border: 1px solid #4fc3f7;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .notice-box p {
            color: #4fc3f7;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Panel de Administración</h1>
        <p class="subtitle">Información del sistema</p>

        <div class="card">
            <div class="notice-box">
                <p>SGFiZWlzIHBlcmRpZG8gZWwgdGllbXBvIGhhY2llbmRvIGVzdG8=</p>
            </div>
        </div>
    </div>
</body>
</html>
