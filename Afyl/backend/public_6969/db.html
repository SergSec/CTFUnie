<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Database - AFYL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4fc3f7;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #4fc3f7;
            margin-bottom: 15px;
        }
        .progress-container {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 3px;
            margin: 20px 0;
        }
        .progress-bar {
            background: linear-gradient(90deg, #4fc3f7, #29b6f6);
            height: 20px;
            border-radius: 8px;
            width: 0%;
            transition: width 0.5s;
        }
        .status {
            text-align: center;
            color: #888;
            margin: 15px 0;
            font-size: 14px;
        }
        .log-box {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            color: #4fc3f7;
        }
        .log-entry {
            margin: 5px 0;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .error { color: #e74c3c; }
        .warn { color: #f39c12; }
        .success { color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Backup</h1>
        <p class="subtitle">Recuperacion de base de datos</p>
        
        <div class="card">
            <h3>Descargando backup...</h3>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="status" id="status">Iniciando conexion segura...</p>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <script>
        const logs = [
            { text: "[INIT] Conectando al servidor de backup...", delay: 500 },
            { text: "[OK] Conexion establecida", delay: 1000, class: "success" },
            { text: "[INFO] Verificando credenciales...", delay: 1500 },
            { text: "[OK] Autenticacion correcta", delay: 2500, class: "success" },
            { text: "[INFO] Buscando archivos de backup...", delay: 3000 },
            { text: "[FOUND] backup_users_2025.sql (2.3 MB)", delay: 4000 },
            { text: "[FOUND] backup_payments_2025.sql (890 KB)", delay: 4500 },
            { text: "[FOUND] backup_credentials.enc (12 KB)", delay: 5000 },
            { text: "[INFO] Iniciando descarga...", delay: 5500 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 10%", delay: 6500 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 25%", delay: 8000 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 47%", delay: 10000 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 68%", delay: 13000 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 89%", delay: 16000 },
            { text: "[WARN] Conexion inestable...", delay: 18000, class: "warn" },
            { text: "[RETRY] Reconectando...", delay: 19000, class: "warn" },
            { text: "[DOWNLOAD] backup_users_2025.sql... 94%", delay: 21000 },
            { text: "[ERROR] Timeout de conexion", delay: 24000, class: "error" },
            { text: "[RETRY] Intento 2 de 3...", delay: 25000, class: "warn" },
            { text: "[DOWNLOAD] Resumiendo... 94%", delay: 27000 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 97%", delay: 30000 },
            { text: "[ERROR] Error de verificacion de integridad", delay: 33000, class: "error" },
            { text: "[WARN] Archivo corrupto detectado", delay: 34000, class: "warn" },
            { text: "[RETRY] Intento 3 de 3...", delay: 36000, class: "warn" },
            { text: "[INFO] Reiniciando descarga completa...", delay: 38000 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 0%", delay: 40000 },
            { text: "[DOWNLOAD] backup_users_2025.sql... 12%", delay: 43000 },
            { text: "[ERROR] Sesion expirada", delay: 46000, class: "error" },
            { text: "[ERROR] Acceso denegado - IP bloqueada temporalmente", delay: 48000, class: "error" },
            { text: "[FATAL] Demasiados intentos fallidos", delay: 50000, class: "error" },
            { text: "[INFO] Reintentando en 300 segundos...", delay: 52000 },
        ];

        const statuses = [
            { text: "Conectando al servidor...", progress: 5, delay: 500 },
            { text: "Autenticando...", progress: 10, delay: 2000 },
            { text: "Escaneando backups disponibles...", progress: 15, delay: 4000 },
            { text: "Descargando backup_users_2025.sql...", progress: 20, delay: 6000 },
            { text: "Descargando... 25%", progress: 35, delay: 8000 },
            { text: "Descargando... 47%", progress: 50, delay: 10000 },
            { text: "Descargando... 68%", progress: 65, delay: 13000 },
            { text: "Descargando... 89%", progress: 80, delay: 16000 },
            { text: "Verificando integridad...", progress: 85, delay: 20000 },
            { text: "Reconectando...", progress: 85, delay: 25000 },
            { text: "Descargando... 97%", progress: 92, delay: 30000 },
            { text: "Error de verificacion...", progress: 92, delay: 33000 },
            { text: "Reintentando...", progress: 50, delay: 38000 },
            { text: "Descargando... 12%", progress: 25, delay: 43000 },
            { text: "Error - IP bloqueada", progress: 0, delay: 48000 },
            { text: "Esperando 300 segundos...", progress: 0, delay: 52000 },
        ];

        const logBox = document.getElementById('logBox');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('status');

        logs.forEach(log => {
            setTimeout(() => {
                const entry = document.createElement('div');
                entry.className = 'log-entry' + (log.class ? ' ' + log.class : '');
                entry.textContent = log.text;
                logBox.appendChild(entry);
                logBox.scrollTop = logBox.scrollHeight;
            }, log.delay);
        });

        statuses.forEach(s => {
            setTimeout(() => {
                progressBar.style.width = s.progress + '%';
                statusText.textContent = s.text;
            }, s.delay);
        });

        setTimeout(() => {
            location.reload();
        }, 60000);
    </script>

    <!-- L3ByaXZpbGVnaWFkb3MvbG9naW4= -->
</body>
</html>
