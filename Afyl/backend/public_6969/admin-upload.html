<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Subida de Archivos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4fc3f7;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-area {
            border: 2px dashed #4fc3f7;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: rgba(79, 195, 247, 0.1);
            border-color: #81d4fa;
        }
        .upload-area.dragover {
            background: rgba(79, 195, 247, 0.2);
            border-color: #fff;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 195, 247, 0.4);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .result.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            display: block;
        }
        .result.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            display: block;
        }
        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 14px;
        }
        .file-path {
            color: #4fc3f7;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <!-- Panel interno de administración - No indexar -->
    <div class="container">
        <h1>📁 Panel de Subida</h1>
        <p class="subtitle">Herramienta interna de administración</p>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📤</div>
                <p>Arrastra un archivo aquí o haz clic para seleccionar</p>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">Se permiten todos los tipos de archivo</p>
                <input type="file" id="fileInput" name="file">
            </div>
            
            <div class="file-info" id="fileInfo" style="display: none;">
                <strong>Archivo seleccionado:</strong>
                <span id="fileName"></span>
            </div>
            
            <button type="submit" class="btn" id="uploadBtn" disabled>Subir Archivo</button>
        </form>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadForm = document.getElementById('uploadForm');
        const result = document.getElementById('result');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileInfo();
            }
        });

        fileInput.addEventListener('change', updateFileInfo);

        function updateFileInfo() {
            if (fileInput.files.length > 0) {
                fileName.textContent = fileInput.files[0].name;
                fileInfo.style.display = 'block';
                uploadBtn.disabled = false;
            }
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!fileInput.files.length) return;
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Subiendo...';
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                const response = await fetch('/api/upload-admin', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `
                        ✅ Archivo subido correctamente<br>
                        <span class="file-path">Ruta: ${data.filePath}</span><br>
                        <span class="file-path">URL: <a href="${data.url}" target="_blank" style="color: #4fc3f7;">${data.url}</a></span>
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = '❌ Error: ' + (data.message || 'Error desconocido');
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = '❌ Error de conexión';
            }
            
            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Subir Archivo';
        });
    </script>
</body>
</html>
